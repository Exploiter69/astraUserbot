name: Repository Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply Ruff repairs
        run: |
          ruff check . --fix
          ruff format .
      - name: Remove one-shot repair workflow
        run: rm -f .github/workflows/repair.yml
      - name: Commit repaired tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: complete repository lint and formatting cleanup"
          git push
